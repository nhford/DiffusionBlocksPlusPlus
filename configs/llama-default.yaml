data_config:
  batch_size_test: 256
  batch_size_train: 256
  dataset_name: roneneldan/TinyStories
  num_examples_test: null
  num_examples_train: null
  sequence_length: 256
  tokenizer_config:
    add_bos_token: true
    add_eos_token: true
    name: NousResearch/Llama-2-7b-chat-hf
    padding_side: right
model_config:
  apply_freq_fix: true
  architectures:
  - LlamaDiTForCausalLM
  attention_bias: false
  attention_dropout: 0.0
  block_boundaries:
  - -4.382026634670962
  - 0.3906031314434941
  - 1.1999804425198743
  - 2.0093477633742842
  - 6.214608098422191
  bos_token_id: 1
  cond_hidden_size: 128
  eos_token_id: 2
  head_dim: 64
  hidden_act: silu
  hidden_size: 768
  initializer_range: 0.02
  intermediate_size: 3072
  max_position_embeddings: 2048
  mlp_bias: false
  model_type: llama
  num_attention_heads: 12
  num_blocks: 4
  num_hidden_layers: 12
  num_key_value_heads: 12
  pretraining_tp: 1
  rms_norm_eps: 1.0e-06
  rope_scaling: null
  rope_theta: 10000.0
  tie_word_embeddings: false
  timestep_conditioning: uniform
  torch_dtype: float32
  transformers_version: 4.52.4
  use_cache: true
  use_timestep_embedding: true
  vocab_size: 32000
noise_config:
  gamma: 0.1
  p_mean: -1.2
  p_std: 1.2
  stdev_max: 80.0
  stdev_min: 0.002
test_config:
  bd3_lm_block_size: 1
  eval_num_steps: 4
  sampler: karras_euler
train_config:
  bd3_lm_block_size: 1
  learning_rate: 0.0003
  num_epochs: 1
  warmup_steps: 100
